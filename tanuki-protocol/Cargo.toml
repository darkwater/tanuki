[package]
name = "tanuki-protocol"
version = "0.1.0"
edition = "2024"

[dependencies]
base64 = { version = "=0.23.1", default-features = false, features = ["std"] }
jiff = { version = "=0.2.37", default-features = false, features = ["std"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["float_roundtrip"] }
thiserror = "=2.0.21"
rmp-serde = "=1.3.1"
