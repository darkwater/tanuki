[package]
name = "tanuki"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
axum = { version = "=0.8.9", default-features = false, features = ["http1", "json", "query", "tokio", "tracing", "ws"] }
base64 = { version = "=0.23.1", default-features = false, features = ["std"] }
jiff = { version = "=0.2.37", default-features = false, features = ["std"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
rmp-serde = "=1.3.1"
thiserror = "=2.0.21"
tokio = { version = "=1.53.2", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tracing = { version = "=0.1.44", default-features = false, features = ["std"] }
tracing-subscriber = { version = "=0.3.23", default-features = false, features = ["fmt", "std"] }

[dev-dependencies]
futures-util = { version = "=0.3.34", default-features = false, features = ["sink", "std"] }
tokio-tungstenite = { version = "=0.29.0", default-features = false, features = ["connect", "handshake"] }
tower = { version = "=0.5.3", default-features = false, features = ["util"] }
