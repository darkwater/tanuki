[package]
name = "tanuki"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
jiff = { version = "=0.2.37", default-features = false, features = ["std"] }
serde = { version = "=1.0.229", features = ["derive"] }
thiserror = "=2.0.21"
tokio = { version = "=1.53.2", features = ["macros", "rt-multi-thread", "signal", "sync"] }

[dev-dependencies]
serde_json = "=1.0.151"
