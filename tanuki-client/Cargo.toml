[package]
name = "tanuki-client"
version = "0.1.0"
edition = "2024"

[dependencies]
tanuki-protocol = { path = "../tanuki-protocol" }
futures-util = { version = "=0.3.34", default-features = false, features = ["sink", "std"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
rmp-serde = "=1.3.1"
thiserror = "=2.0.21"
tokio = { version = "=1.53.2", features = ["macros", "net", "rt", "sync", "time"] }
tokio-tungstenite = { version = "=0.29.0", default-features = false, features = ["connect", "handshake"] }
tracing = { version = "=0.1.44", default-features = false, features = ["std"] }
jiff = { version = "=0.2.37", default-features = false, features = ["std"] }
serde-value = "=0.7.0"

[dev-dependencies]
tokio = { version = "=1.53.2", features = ["signal"] }
serde_bytes = "=0.11.19"
