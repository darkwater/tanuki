[package]
name = "tanuki-client"
version = "0.1.0"
edition = "2024"

[dependencies]
tanuki-protocol = { path = "../tanuki-protocol" }
futures-util = { version = "=0.3.34", default-features = false, features = ["sink", "std"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
rmp-serde = "=1.3.1"
thiserror = "=2.0.21"
tokio = { version = "=1.53.2", features = ["macros", "sync"] }
tracing = { version = "=0.1.44", default-features = false, features = ["std"] }
jiff = { version = "=0.2.37", default-features = false, features = ["std"] }
serde-value = "=0.7.0"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "=1.53.2", features = ["net", "rt", "time"] }
tokio-tungstenite = { version = "=0.29.0", default-features = false, features = ["connect", "handshake"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
gloo-net = { version = "=0.7.0", default-features = false, features = ["websocket"] }
gloo-timers = { version = "=0.4.0", features = ["futures"] }
wasm-bindgen-futures = "=0.4.80"
web-time = "=1.1.0"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tokio = { version = "=1.53.2", features = ["signal"] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "=0.3.80"

[dev-dependencies]
serde_bytes = "=0.11.19"
